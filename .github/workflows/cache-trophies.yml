# Caches the GitHub trophy images shown at the top of my profile README.
#
# Why: the trophies come from my self-hosted github-profile-trophy server on Vercel.
# Loaded live, every profile visit could wait on a cold start plus GitHub API calls
# for each of the seven images. Instead, this workflow renders them twice a day and
# stores the SVGs as static files, so the README loads them instantly from GitHub.
#
# How: rather than calling github-trophies.devomb.com (Cloudflare's Bot Fight Mode
# blocks GitHub's runners, and I want it on), the workflow runs my fork of the trophy
# server right here on the runner and requests the images from localhost. Same code,
# same output as the live server, and nothing to maintain outside this repo.
#
# Why a separate `output` branch: the images are force-pushed there as one single
# commit that gets replaced on every refresh, so main's history never fills up with
# bot commits.

name: Cache trophies

on:
  schedule:
    # 12:10 AM and 12:10 PM Pacific; the timezone handles the PST/PDT switch automatically.
    # Not right on the hour: GitHub's scheduler is busiest at :00 and can delay or drop
    # runs then (the first midnight run was skipped), so a few minutes past is more reliable.
    - cron: "10 0,12 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write # push the output branch
  actions: write  # keep this schedule from being auto-disabled (last step)

concurrency:
  group: cache-trophies

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUERY: username=DevomB&theme=aura&no-frame=true&column=1&rank=SECRET,SSS,SS,S,AAA,AA,A
      TITLES: MultiLanguage Joined2020 Organizations Commits PullRequest Experience Repositories
    steps:
      - name: Check out my trophy server
        uses: actions/checkout@v4
        with:
          repository: DevomB/Github-Trophies
          path: trophy-server

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # Same version the Vercel deployment runs (vercel-deno@3.1.1).
          deno-version: v1.44.4

      - name: Render trophies
        env:
          # The workflow's built-in token gives byte-identical output to the live server.
          GITHUB_TOKEN1: ${{ github.token }}
          PORT: "8080"
        run: |
          (cd trophy-server && deno run --allow-all main.ts &)
          for i in $(seq 1 90); do
            curl --silent --output /dev/null http://localhost:8080/ && break
            sleep 1
          done

          mkdir -p out
          for title in $TITLES; do
            file="out/$title.svg"
            curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 60 \
              -o "$file" "http://localhost:8080/?$QUERY&title=$title"
            # Only accept a real trophy, so a bad response can never replace a good image.
            # Any failure stops the job before publishing, leaving the last good set live.
            if ! grep -q "<svg" "$file" || ! grep -q ">$title</text>" "$file"; then
              echo "::error::$title trophy did not render correctly"
              exit 1
            fi
          done

      - name: Publish to output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init --quiet --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --quiet -m "Update cached trophy images"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Skip the push when nothing changed. Identical files give an identical tree hash.
          if git fetch --quiet --depth=1 "$remote" output 2>/dev/null &&
             [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})" ]; then
            echo "Trophies unchanged; nothing to publish."
            exit 0
          fi

          # Fresh orphan commit + force push = the branch always holds exactly one commit.
          git push --quiet --force "$remote" output
          echo "Published updated trophies."

      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub disables scheduled workflows in public repos after 60 days without
        # repo activity. Re-enabling it on every run keeps the refresh going.
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/cache-trophies.yml/enable"
